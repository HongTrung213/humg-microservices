{% if thong_bao_moi %}
<div class="card border-0 shadow-sm rounded-4 mb-4">
    <div class="card-header bg-white border-0 pt-3">
        <h5 class="fw-bold" style="color:var(--red-primary);"><i class="fa-regular fa-bell text-warning me-2"></i>Thông báo & Cảnh báo dành cho bạn</h5>
    </div>
    <div class="card-body p-0">
        <div class="list-group list-group-flush">
            {% for tb in thong_bao_moi %}
            <a {% if tb.link_url %}href="{{ tb.link_url }}" target="_blank"{% else %}href="javascript:void(0)"{% endif %} class="list-group-item list-group-item-action p-3 border-bottom">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <span class="badge bg-light text-dark border mb-2">{{ tb.get_loai_display }}</span>
                        <h6 class="fw-bold mb-1">{{ tb.tieu_de }}</h6>
                        <p class="mb-0 text-muted small">{{ tb.noi_dung|striptags|truncatechars:180 }}</p>
                    </div>
                    <small class="text-muted ms-3">{{ tb.created_at|date:'d/m/Y' }}</small>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
